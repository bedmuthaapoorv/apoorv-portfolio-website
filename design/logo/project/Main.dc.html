<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo A — Cursor tile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.cur{animation:none !important}}
</style>
</helmet>
<div style="width: 1200px; height: 760px; box-sizing: border-box; padding: 40px; background: #0a0c0f; color: #e7eaee; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; flex-grow: 1">
    <div style="background: #0f1217; border: 1px solid #1e242c; border-radius: 20px; display: flex; align-items: center; justify-content: center">
      <div style="display: flex; align-items: center; gap: 22px">
        <div style="width: 104px; height: 104px; border-radius: 24px; background: {{accent}}; display: flex; align-items: center; justify-content: center; gap: 3px">
          <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 50px; letter-spacing: -3px; color: #0a0c0f; line-height: 1">ab</span>
          <span class="cur" style="width: 7px; height: 44px; background: #0a0c0f; border-radius: 1px; animation: blink 1.1s steps(1) infinite"></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-weight: 600; font-size: 38px; letter-spacing: -1px; line-height: 1">Apoorv Bedmutha</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #a2a9b4; letter-spacing: 0.5px">full-stack engineer</span>
        </div>
      </div>
    </div>
    <div style="background: #f7f8fa; border-radius: 20px; display: flex; align-items: center; justify-content: center">
      <div style="display: flex; align-items: center; gap: 22px">
        <div style="width: 104px; height: 104px; border-radius: 24px; background: #0f1217; display: flex; align-items: center; justify-content: center; gap: 3px">
          <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 50px; letter-spacing: -3px; color: #f7f8fa; line-height: 1">ab</span>
          <span style="width: 7px; height: 44px; background: {{accent}}; border-radius: 1px"></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-weight: 600; font-size: 38px; letter-spacing: -1px; line-height: 1; color: #0f1217">Apoorv Bedmutha</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #4a5260; letter-spacing: 0.5px">full-stack engineer</span>
        </div>
      </div>
    </div>
  </div>
  <div style="display: flex; align-items: flex-end; gap: 40px; padding: 8px 8px 0">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: flex-end; gap: 16px">
        <div style="width: 64px; height: 64px; border-radius: 15px; background: {{accent}}; display: flex; align-items: center; justify-content: center"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 30px; letter-spacing: -2px; color: #0a0c0f">ab</span></div>
        <div style="width: 32px; height: 32px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; letter-spacing: -1px; color: #0a0c0f">ab</span></div>
        <div style="width: 16px; height: 16px; border-radius: 4px; background: {{accent}}; display: flex; align-items: center; justify-content: center"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 8px; letter-spacing: -0.5px; color: #0a0c0f">ab</span></div>
      </div>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8a929e">favicon · 64 / 32 / 16</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="width: 96px; height: 96px; border-radius: 50%; background: #0f1217; border: 1px solid #1e242c; display: flex; align-items: center; justify-content: center; gap: 2px">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 34px; letter-spacing: -2px; color: #e7eaee">ab</span>
        <span style="width: 5px; height: 30px; background: {{accent}}"></span>
      </div>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8a929e">avatar</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
      <div style="height: 60px; border-radius: 14px; background: #0f1217; border: 1px solid #1e242c; display: flex; align-items: center; gap: 12px; padding: 0 18px">
        <div style="width: 28px; height: 28px; border-radius: 7px; background: {{accent}}; display: flex; align-items: center; justify-content: center"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; letter-spacing: -1px; color: #0a0c0f">ab</span></div>
        <span style="font-weight: 600; font-size: 15px">Apoorv Bedmutha</span>
        <span style="margin-left: auto; font-size: 14px; color: #a2a9b4">Work · Projects · Writing · Contact</span>
      </div>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8a929e">site header</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff7a45","options":["#ff7a45","#3ddc97","#7aa2ff","#f5b84a"]},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#ff7a45' };
  }
}
</script>
</body>
</html>
