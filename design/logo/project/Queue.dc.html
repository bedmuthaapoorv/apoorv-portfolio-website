<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo B — Queue monogram</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 760px; box-sizing: border-box; padding: 40px; background: #0a0c0f; color: #e7eaee; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; flex-grow: 1">
    <div style="background: #0f1217; border: 1px solid #1e242c; border-radius: 20px; display: flex; align-items: center; justify-content: center">

          <svg width="76" height="76" viewBox="0 0 100 100" role="img" aria-label="Apoorv Bedmutha monogram">
            <polyline points="20,84 50,16 80,84" fill="none" stroke="#e7eaee" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></polyline>
            <rect x="33" y="55" width="9" height="9" rx="1.5" fill="{{accent}}"></rect>
            <rect x="45.5" y="55" width="9" height="9" rx="1.5" fill="{{accent}}"></rect>
            <rect x="58" y="55" width="9" height="9" rx="1.5" fill="{{accent}}" opacity="0.4"></rect>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-weight: 600; font-size: 38px; letter-spacing: -1px; line-height: 1">Apoorv Bedmutha</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #a2a9b4; letter-spacing: 0.5px">full-stack engineer</span>
        </div>
      </div>
    </div>
    <div style="background: #f7f8fa; border-radius: 20px; display: flex; align-items: center; justify-content: center">
      <div style="display: flex; align-items: center; gap: 22px">
        <svg width="96" height="96" viewBox="0 0 100 100" role="img" aria-label="Apoorv Bedmutha monogram">
          <polyline points="20,84 50,16 80,84" fill="none" stroke="#0f1217" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></polyline>
          <rect x="33" y="55" width="9" height="9" rx="1.5" fill="#d9481a"></rect>
          <rect x="45.5" y="55" width="9" height="9" rx="1.5" fill="#d9481a"></rect>
          <rect x="58" y="55" width="9" height="9" rx="1.5" fill="#d9481a" opacity="0.4"></rect>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-weight: 600; font-size: 38px; letter-spacing: -1px; line-height: 1; color: #0f1217">Apoorv Bedmutha</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #4a5260; letter-spacing: 0.5px">full-stack engineer</span>
        </div>
      </div>
    </div>
  </div>
  <div style="display: flex; align-items: flex-end; gap: 40px; padding: 8px 8px 0">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: flex-end; gap: 16px">
        <div style="width: 64px; height: 64px; border-radius: 15px; background: #0f1217; border: 1px solid #2a313b; display: flex; align-items: center; justify-content: center">
          <svg width="46" height="46" viewBox="0 0 100 100" aria-hidden="true"><polyline points="20,84 50,16 80,84" fill="none" stroke="#e7eaee" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></polyline><rect x="32" y="54" width="11" height="11" rx="2" fill="{{accent}}"></rect><rect x="44.5" y="54" width="11" height="11" rx="2" fill="{{accent}}"></rect><rect x="57" y="54" width="11" height="11" rx="2" fill="{{accent}}" opacity="0.4"></rect></svg>

          <svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true"><polyline points="20,84 50,16 80,84" fill="none" stroke="#e7eaee" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></polyline><rect x="38" y="52" width="24" height="13" rx="2" fill="{{accent}}"></rect></svg>
        </div>
        <div style="width: 16px; height: 16px; border-radius: 4px; background: #0f1217; display: flex; align-items: center; justify-content: center">

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="width: 96px; height: 96px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="56" height="56" viewBox="0 0 100 100" aria-hidden="true"><polyline points="20,84 50,16 80,84" fill="none" stroke="#0a0c0f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></polyline><rect x="33" y="55" width="9" height="9" rx="1.5" fill="#0a0c0f"></rect><rect x="45.5" y="55" width="9" height="9" rx="1.5" fill="#0a0c0f"></rect><rect x="58" y="55" width="9" height="9" rx="1.5" fill="#0a0c0f" opacity="0.4"></rect></svg>
      </div>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8a929e">avatar</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
      <div style="height: 60px; border-radius: 14px; background: #0f1217; border: 1px solid #1e242c; display: flex; align-items: center; gap: 12px; padding: 0 18px">

        <span style="font-weight: 600; font-size: 15px">Apoorv Bedmutha</span>
        <span style="margin-left: auto; font-size: 14px; color: #a2a9b4">Work · Projects · Writing · Contact</span>
      </div>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8a929e">site header</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff7a45","options":["#ff7a45","#3ddc97","#7aa2ff","#f5b84a"]},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#ff7a45' };
  }
}
</script>
</body>
</html>
