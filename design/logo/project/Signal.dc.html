<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo C — Signal wordmark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 760px; box-sizing: border-box; padding: 40px; background: #0a0c0f; color: #e7eaee; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; flex-grow: 1">
    <div style="background: #0f1217; border: 1px solid #1e242c; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
      <div style="display: flex; align-items: baseline; gap: 4px">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 84px; letter-spacing: -5px; line-height: 1">apoorv</span>
        <span style="width: 18px; height: 18px; background: {{accent}}; border-radius: 2px"></span>
      </div>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #a2a9b4; letter-spacing: 3px">BEDMUTHA · FULL-STACK</span>
    </div>
    <div style="background: #f7f8fa; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
      <div style="display: flex; align-items: baseline; gap: 4px">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 84px; letter-spacing: -5px; line-height: 1; color: #0f1217">apoorv</span>
        <span style="width: 18px; height: 18px; background: #d9481a; border-radius: 2px"></span>
      </div>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #4a5260; letter-spacing: 3px">BEDMUTHA · FULL-STACK</span>
    </div>
  </div>
  <div style="display: flex; align-items: flex-end; gap: 40px; padding: 8px 8px 0">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: flex-end; gap: 16px">
        <div style="width: 64px; height: 64px; border-radius: 15px; background: #0f1217; border: 1px solid #2a313b; display: flex; align-items: baseline; justify-content: center; padding-top: 6px; box-sizing: border-box; gap: 2px">
          <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 38px; letter-spacing: -2px; color: #e7eaee; line-height: 1">a</span>
          <span style="width: 9px; height: 9px; background: {{accent}}; border-radius: 1px"></span>
        </div>
        <div style="width: 32px; height: 32px; border-radius: 8px; background: #0f1217; border: 1px solid #2a313b; display: flex; align-items: baseline; justify-content: center; padding-top: 3px; box-sizing: border-box; gap: 1px">
          <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; letter-spacing: -1px; color: #e7eaee; line-height: 1">a</span>
          <span style="width: 5px; height: 5px; background: {{accent}}"></span>
        </div>
        <div style="width: 16px; height: 16px; border-radius: 4px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
          <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; color: #0a0c0f; line-height: 1">a</span>
        </div>
      </div>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8a929e">favicon · 64 / 32 / 16</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="width: 96px; height: 96px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 52px; letter-spacing: -3px; color: #0a0c0f; line-height: 1">a.</span>
      </div>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8a929e">avatar</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
      <div style="height: 60px; border-radius: 14px; background: #0f1217; border: 1px solid #1e242c; display: flex; align-items: center; gap: 12px; padding: 0 18px">
        <div style="display: flex; align-items: baseline; gap: 2px">
          <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 20px; letter-spacing: -1px; line-height: 1">apoorv</span>
          <span style="width: 5px; height: 5px; background: {{accent}}"></span>
        </div>
        <span style="margin-left: auto; font-size: 14px; color: #a2a9b4">Work · Projects · Writing · Contact</span>
      </div>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8a929e">site header</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff7a45","options":["#ff7a45","#3ddc97","#7aa2ff","#f5b84a"]},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#ff7a45' };
  }
}
</script>
</body>
</html>
